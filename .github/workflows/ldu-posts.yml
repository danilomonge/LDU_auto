name: LDU Instagram posts

on:
  schedule:
    # Twice an hour at off-peak minutes — the pipeline is a no-op unless ESPN
    # state changed (new next match, rescheduled kickoff, or a freshly
    # finished game). GitHub sheds scheduled runs at the congested top of the
    # hour: on '0 * * * *' only ~4-5 of 24 daily runs fired from 2026-09 on
    # (≈21/day in August), so results went out hours late. Two odd minutes
    # keep roughly hourly coverage even when one slot is dropped. GitHub's
    # delays are platform-wide, though, so around each LDU match the last
    # step below takes over with its own short, bounded timer.
    - cron: '17,47 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ldu-posts
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # the match-day watch dispatches ldu-wakeup.yml

jobs:
  generate-and-publish:
    # Pinned: 'ubuntu-latest' is migrating to Ubuntu 26 (from 2026-10-19), and
    # `playwright install --with-deps` depends on the distro's package names.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Pull latest state committed by previous runs.
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Generate posts on state changes
        run: node src/index.js generate

      - name: Prune rendered posts older than 30 days
        run: node src/index.js cleanup

      - name: Commit generated posts and state
        id: commit
        run: |
          git config user.name "ldu-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data output
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "posts: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve access token
        # Prefer the auto-renewed encrypted token (data/token.enc) over the
        # static IG_ACCESS_TOKEN secret — but keep the secret as a FALLBACK
        # in the publish token chain, so a botched renewal alone can't take
        # publishing down while the secret is still valid.
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          T="$IG_ACCESS_TOKEN"
          if [ -n "$TOKEN_KEY" ] && [ -f data/token.enc ]; then
            T=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:TOKEN_KEY -base64 -A -in data/token.enc)
            echo "Using auto-renewed token from data/token.enc (secret kept as fallback)"
            if [ -n "$IG_ACCESS_TOKEN" ] && [ "$IG_ACCESS_TOKEN" != "$T" ]; then
              echo "IG_ACCESS_TOKEN_FALLBACK=$IG_ACCESS_TOKEN" >> "$GITHUB_ENV"
            fi
          else
            echo "Using IG_ACCESS_TOKEN secret directly"
          fi
          echo "::add-mask::$T"
          echo "IG_ACCESS_TOKEN=$T" >> "$GITHUB_ENV"

      - name: Publish pending posts to Instagram
        # Runs after push so the PNGs are reachable at their public raw URLs.
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FACEBOOK_USER_ID: ${{ secrets.FACEBOOK_USER_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: node src/index.js publish

      - name: Commit publish-queue updates
        # Must run even when publishing partially failed: the queue file
        # records which posts DID go out, preventing duplicates on retry.
        if: always()
        run: |
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "publish: clear queue $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Match-day watch — schedule the next check
        # GitHub fires scheduled runs only every ~4-9h lately (results went
        # out up to 7.5h after the final whistle). From 12h before an LDU
        # kickoff until its result, queue, and table are all out (at most 8h
        # after kickoff), hand off to ldu-wakeup.yml, which sleeps and then
        # re-runs this workflow. src/watch.js decides; outside that window
        # nothing is dispatched and the cron alone drives the pipeline.
        # Runs even after a failed step, so a transient error is retried soon.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delay=$(node src/index.js watch)
          if [ -n "$delay" ]; then
            for _ in 1 2 3; do
              gh workflow run ldu-wakeup.yml --repo "$GITHUB_REPOSITORY" --ref main -f delay="$delay" && exit 0
              sleep 20
            done
            echo "::error::Could not dispatch ldu-wakeup.yml; the cron will pick up the next check."
            exit 1
          fi
